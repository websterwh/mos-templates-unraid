name: Update Unraid CA templates

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

# Only ever run one instance of this workflow at a time. Without this, two
# overlapping runs (e.g. a manual trigger while the scheduled run is still
# going) both check out the same base commit, and whichever pushes second
# gets rejected as a non-fast-forward push.
concurrency:
  group: update-templates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate docker templates from the Unraid CA feed
        run: python3 scripts/update_templates.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker/
          if git diff --cached --quiet; then
            echo "No template changes this run."
            exit 0
          fi
          git commit -m "Auto-update Unraid CA templates ($(date -u +%Y-%m-%d))"
          # In case main moved since checkout (e.g. a run that slipped past
          # the concurrency guard), rebase onto the latest remote before
          # pushing instead of failing outright.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, pulling latest and retrying ($attempt/3) ..."
            git pull --rebase origin main
          done
          echo "Push still failing after retries."
          exit 1
